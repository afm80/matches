<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول مباريات اليوم</title>
<style>
:root{color-scheme:dark;--card:#18181b;--card2:#202024;--ink:#f5f5f2;--mute:#9b9ba1;--line:#2c2c31;--accent:#ff7a00;--on:#111111}
*{box-sizing:border-box}
html{background:#0b0b0c}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,#232326 0%,#121214 38%,#070708 100%) fixed;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(160deg,#2a2a2e,#101012);border-bottom:3px solid var(--accent);padding:22px 14px 16px;border-radius:0 0 18px 18px}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0 0 14px;font-size:1.5rem}
.days{display:flex;gap:8px;margin-bottom:10px}
.days button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0d0d0f;color:var(--ink);font:inherit}
input::placeholder{color:var(--mute)}
input:focus,.days button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:720px;margin:0 auto;padding:6px 14px 40px}
h2{font-size:.98rem;margin:22px 0 8px;padding-right:10px;border-right:4px solid var(--accent)}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(145deg,#1f1f23,#141416);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-weight:600;font-size:.92rem}
.t img{width:44px;height:44px;object-fit:contain}
.ph{width:44px;height:44px;border-radius:50%;background:var(--line)}
.mid{text-align:center;min-width:72px}
.time{font-size:1.15rem;font-weight:700;direction:ltr;color:var(--accent)}
.score{font-size:1.3rem;font-weight:800;direction:ltr}
.st{font-size:.75rem;color:var(--mute)}
.st.live{display:inline-block;background:var(--accent);color:var(--on);font-weight:700;border-radius:20px;padding:0 8px}
.msg{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>⚽ جدول المباريات</h1>
  <div class="days" id="days"></div>
  <input id="q" placeholder="ابحث عن فريق أو دوري">
</div></header>
<main id="list"><div class="msg">جاري التحميل…</div></main>

<script>
let offset = 0, all = [], failed = false;
const dayLabels = ["أمس","اليوم","غداً"];
const LIVE = ["1H","HT","2H","ET","BT","P","LIVE"], DONE = ["FT","AET","PEN"], OFF = ["PST","CANC","ABD","SUSP"];
const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function buildTabs(){
  const box = document.getElementById("days");
  box.innerHTML = "";
  [-1,0,1].forEach((o,i)=>{
    const b = document.createElement("button");
    b.textContent = dayLabels[i];
    if(o===offset) b.className = "on";
    b.onclick = ()=>{offset=o;buildTabs();render();};
    box.appendChild(b);
  });
}

async function load(){
  try{
    const r = await fetch("data.json?v="+Date.now());
    all = (await r.json()).matches || [];
  }catch(e){ failed = true; }
  render();
}

function localTime(m){
  return new Date(m.t).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit",hour12:false});
}

function team(name,logo){
  const img = logo ? `<img loading="lazy" src="${logo}" alt="">` : '<div class="ph"></div>';
  return `<div class="t">${img}<span>${name}</span></div>`;
}

function render(){
  const list = document.getElementById("list");
  if(failed){list.innerHTML='<div class="msg">تعذر تحميل البيانات. حاول لاحقاً.</div>';return;}
  const d = new Date(); d.setDate(d.getDate()+offset);
  const key = dkey(d);
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = all.filter(m=>dkey(new Date(m.t))===key && (!q||`${m.h} ${m.a} ${m.lg}`.toLowerCase().includes(q)));
  if(!rows.length){list.innerHTML='<div class="msg">لا توجد مباريات لهذا اليوم.</div>';return;}
  const groups = {};
  rows.forEach(m=>(groups[m.lg]=groups[m.lg]||[]).push(m));
  list.innerHTML = Object.entries(groups).map(([lg,ms])=>`<h2>${lg}</h2>`+ms.map(m=>{
    const live = LIVE.includes(m.s), done = DONE.includes(m.s), off = OFF.includes(m.s);
    let mid;
    if(live||done) mid = `<div class="score">${m.gh} - ${m.ga}</div><div class="st ${live?"live":""}">${live?"مباشر":"انتهت"}</div>`;
    else if(off) mid = `<div class="st">مؤجلة</div>`;
    else mid = `<div class="time">${localTime(m)}</div><div class="st">لم تبدأ</div>`;
    return `<div class="m">${team(m.h,m.hl)}<div class="mid">${mid}</div>${team(m.a,m.al)}</div>`;
  }).join("")).join("");
}

document.getElementById("q").addEventListener("input",render);
buildTabs();load();
</script>
</body>
</html>
