<style>
:root{color-scheme:dark;--card:#18181b;--card2:#202024;--ink:#f5f5f2;--mute:#9b9ba1;--line:#2c2c31;--accent:#ff7a00;--on:#111111;--bg1:#232326;--bg2:#121214;--bg3:#070708;--h1:#2a2a2e;--h2:#101012;--m1:#1f1f23;--m2:#141416;--inp:#0d0d0f}
:root[data-theme="light"]{color-scheme:light;--card:#ffffff;--card2:#f1f1f3;--ink:#16161a;--mute:#6b6b73;--line:#e0e0e4;--accent:#e65f00;--on:#ffffff;--bg1:#ffffff;--bg2:#f4f4f6;--bg3:#ececef;--h1:#ffffff;--h2:#f1f1f4;--m1:#ffffff;--m2:#f7f7f9;--inp:#ffffff}
*{box-sizing:border-box}
html{background:var(--bg3)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 100%) fixed;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(160deg,var(--h1),var(--h2));border-bottom:3px solid var(--accent);padding:22px 14px 16px;border-radius:0 0 18px 18px}
.wrap{max-width:720px;margin:0 auto}
.top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:8px}
.brand{text-align:center}
.logo{font-family:"Segoe UI",Arial,sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:.5px;line-height:1.2}
.logo span{color:var(--accent)}
h1{margin:0 0 4px;font-size:1.2rem;text-align:center}
.tz{text-align:center;font-size:.8rem;color:var(--mute);margin-bottom:12px}
#theme,#menuBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:1.2rem;cursor:pointer;line-height:1}
.days{display:flex;gap:8px;margin-bottom:10px}
.days button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);font:inherit}
input::placeholder{color:var(--mute)}
input:focus,.days button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:720px;margin:0 auto;padding:6px 14px 40px}
h2{font-size:.98rem;margin:22px 0 8px;padding-right:10px;border-right:4px solid var(--accent)}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(145deg,var(--m1),var(--m2));border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-weight:600;font-size:.92rem}
.t img{width:44px;height:44px;object-fit:contain}
.ph{width:44px;height:44px;border-radius:50%;background:var(--line)}
.mid{text-align:center;min-width:72px}
.time{font-size:1.15rem;font-weight:700;direction:ltr;color:var(--accent)}
.score{font-size:1.3rem;font-weight:800;direction:ltr}
.st{font-size:.75rem;color:var(--mute)}
.st.live{display:inline-block;background:var(--accent);color:var(--on);font-weight:700;border-radius:20px;padding:0 8px}
.more{display:block;width:100%;margin:20px 0 6px;padding:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.m{cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;border-top:3px solid var(--accent);padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph-top h3{margin:0;font-size:1rem}
.x{border:1px solid var(--line);background:var(--card2);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:16px 0}
.big .t img{width:56px;height:56px}
.info{margin:0;border-top:1px solid var(--line)}
.info div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.info dt{color:var(--mute)}
.info dd{margin:0;font-weight:600;text-align:left}
.evh{margin:18px 0 6px;font-size:.98rem;padding-right:10px;border-right:4px solid var(--accent)}
.ev{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.ev .mn{min-width:44px;color:var(--accent);font-weight:700;direction:ltr;text-align:right}
.ev .tm{color:var(--mute);font-size:.8rem;margin-right:auto}
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19}
.drawer-ov[hidden]{display:none}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(82vw,320px);background:var(--card);color:var(--ink);border-left:3px solid var(--accent);transform:translateX(100%);transition:transform .2s;z-index:20;overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer.open{transform:none}
#menuList{margin-top:12px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:2px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:right;border-radius:10px;cursor:pointer}
.mi img{width:26px;height:26px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex:none}
.mi.on{background:var(--accent);color:var(--on);font-weight:700}
.site{display:block;margin-top:16px;padding:12px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);text-align:center;font-weight:700;text-decoration:none}
.lghead{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.lghead img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.lgt{font-weight:800;font-size:1.05rem}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px;margin-bottom:10px}
.tb{width:100%;border-collapse:collapse;font-size:.85rem}
.tb th{color:var(--mute);font-weight:600;padding:8px 4px;text-align:center;white-space:nowrap}
.tb td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
.tb td.tn{text-align:right;min-width:130px}
.tnw{display:flex;align-items:center;gap:6px}
.tnw img{width:20px;height:20px;object-fit:contain}
.sc{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.sc .rk{width:22px;color:var(--accent);font-weight:700;text-align:center}
.sc img{width:24px;height:24px;object-fit:contain}
.sc .nm{flex:1;font-size:.92rem}
.sc .nm small{display:block;color:var(--mute)}
.sc .gl{font-weight:800}
.msg{text-align:center;color:var(--mute);padding:40px 0}

</head>

<script>
let offset = 0, all = [], failed = false;
const dayLabels = ["أمس","اليوم","غداً"];
const LIVE = ["1H","HT","2H","ET","BT","P","LIVE"], DONE = ["FT","AET","PEN"], OFF = ["PST","CANC","ABD","SUSP"];
const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function buildTabs(){
  const box = document.getElementById("days");
  box.innerHTML = "";
  [-1,0,1].forEach((o,i)=>{
    const b = document.createElement("button");
    b.textContent = dayLabels[i];
    if(o===offset) b.className = "on";
    b.onclick = ()=>{offset=o;buildTabs();render();};
    box.appendChild(b);
  });
}

async function load(){
  try{
    const r = await fetch("data.json?v="+Date.now());
    all = (await r.json()).matches || [];
    all.forEach((m,i)=>m._i=i);
  }catch(e){ failed = true; }
  render();
}

function localTime(m){
  return new Date(m.t).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit",hour12:false});
}

function team(name,logo){
  const img = logo ? `<img loading="lazy" src="${logo}" alt="">` : '<div class="ph"></div>';
  return `<div class="t">${img}<span>${tn(name)}</span></div>`;
}

const KEYWORDS = [["super cup","السوبر"],["nations league","دوري الأمم"],["premier league","الدوري الممتاز"],["first division","الدرجة الأولى"],["second division","الدرجة الثانية"],["pro league","دوري المحترفين"],["professional league","دوري المحترفين"],["friendlies clubs","ودية أندية"],["friendlies","ودية"],["championship","البطولة"],["qualification","التصفيات"],["cup","الكأس"],["league","الدوري"]];
function tn(name){ const k = norm(name); return TEAMS[k] || COUNTRIES[k] || name; }
function lgAr(lg){
  const i = lg.lastIndexOf(" - ");
  let name = i>-1 ? lg.slice(0,i) : lg, country = i>-1 ? lg.slice(i+3) : "";
  KEYWORDS.forEach(([en,ar])=>{ name = name.replace(new RegExp(en,"ig"), ar); });
  const c = country ? (COUNTRIES[norm(country)] || country) : "";
  return c ? `${name} - ${c}` : name;
}

// الدوريات والبطولات المسموحة فقط (نفس أرقام fetch_matches.py)
const KEEP = new Set([2,3,848,5,4,1,7,17,6,36,9,25,32,30,29,34,39,140,135,78,61,542]);
const SKIP = /\bu-?\d{2}\b|women|\(w\)|\bw$|reserve|youth|development league|\bii\b|\bb team\b/i;
const RULES = [
 ["دوري أبطال أوروبا",/^uefa champions league -/i],
 ["الدوري الأوروبي",/^uefa europa league -/i],
 ["دوري المؤتمر الأوروبي",/^uefa (europa )?conference league -/i],
 ["دوري الأمم الأوروبية",/^uefa nations league -/i],
 ["كأس أمم أوروبا",/euro championship|uefa euro/i],
 ["كأس العالم",/^world cup/i],
 ["كأس آسيا",/asian cup/i],

 ["الدوري العراقي",/- iraq$/i,/second|third|division [23]|league 2|amateur/i]
];
let showRest = false;

function ruleOf(m){
  for(let i=0;i<RULES.length;i++){
    const [ar,re,ex]=RULES[i];
    if(re.test(m.lg) && !(ex && ex.test(m.lg))) return {i, title: ar || lgAr(m.lg)};
  }
  return null;
}

function card(m){
  const live = LIVE.includes(m.s), done = DONE.includes(m.s), off = OFF.includes(m.s);
  let mid;
  if(live||done) mid = `<div class="score">${m.gh} - ${m.ga}</div><div class="st ${live?"live":""}">${live?"مباشر":"انتهت"}</div>`;
  else if(off) mid = `<div class="st">مؤجلة</div>`;
  else mid = `<div class="time">${localTime(m)}</div><div class="st">لم تبدأ</div>`;
  return `<div class="m" data-i="${m._i}">${team(m.h,m.hl)}<div class="mid">${mid}</div>${team(m.a,m.al)}</div>`;
}

function groupHtml(rows){
  const g = {};
  rows.forEach(m=>(g[m.lg]=g[m.lg]||[]).push(m));
  return Object.entries(g).map(([lg,ms])=>`<h2>${lgAr(lg)}</h2>`+ms.map(card).join("")).join("");
}

function render(){
  const list = document.getElementById("list");
  if(failed){list.innerHTML='<div class="msg">تعذر تحميل البيانات. حاول لاحقاً.</div>';return;}
  const d = new Date(); d.setDate(d.getDate()+offset);
  const key = dkey(d);
  const day = all.filter(m=>KEEP.has(m.li) && dkey(new Date(m.t))===key && !SKIP.test(`${m.lg} ${m.h} ${m.a}`));
  if(!day.length){list.innerHTML='<div class="msg">لا توجد مباريات لهذا اليوم.</div>';return;}
  day.forEach(m=>{ m._r = ruleOf(m) || {i:99,title:lgAr(m.lg)}; });
  const ended = m => DONE.includes(m.s) || OFF.includes(m.s);
  const grp = m => LIVE.includes(m.s) ? 0 : ended(m) ? 2 : 1;
  // ترتيب الدوريات كما هو، وداخل كل دوري: المباشرة ثم القادمة ثم المنتهية (الأحدث أولاً)
  day.sort((a,b)=>a._r.i-b._r.i || a.lg.localeCompare(b.lg) || grp(a)-grp(b)
    || (grp(a)===2 ? b.t.localeCompare(a.t) : a.t.localeCompare(b.t)));
  const g = {};
  day.forEach(m=>(g[m._r.title]=g[m._r.title]||[]).push(m));
  list.innerHTML = Object.entries(g).map(([t,ms])=>`<h2>${t}</h2>`+ms.map(card).join("")).join("");
}

const TZ_CITIES = {"Baghdad":"بغداد","Riyadh":"الرياض","Cairo":"القاهرة","Dubai":"دبي","Kuwait":"الكويت","Qatar":"الدوحة","Amman":"عمّان","Beirut":"بيروت","Damascus":"دمشق","Casablanca":"المغرب","Algiers":"الجزائر","Tunis":"تونس","Tripoli":"طرابلس","Khartoum":"الخرطوم","Muscat":"مسقط","Bahrain":"البحرين","Aden":"اليمن","Gaza":"فلسطين","Hebron":"فلسطين","Jerusalem":"القدس"};
function tzLabel(){
  try{
    const id = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    const city = TZ_CITIES[id.split("/").pop()];
    const off = -new Date().getTimezoneOffset()/60;
    const gmt = "GMT" + (off>=0?"+":"-") + Math.abs(off);
    let name = city;
    if(!name){
      const p = new Intl.DateTimeFormat("ar",{timeZoneName:"long"}).formatToParts(new Date()).find(x=>x.type==="timeZoneName");
      name = p ? p.value : id;
    }
    return `المواعيد بتوقيت ${name} (${gmt})`;
  }catch(e){ return ""; }
}
document.getElementById("tz").textContent = tzLabel();
